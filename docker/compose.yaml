# Локальный стенд dcm4chee-arc-light для разработки нового фронта.
#
# Отличия от официального compose (dcm4che-dockerfiles/dcm4chee-arc-psql):
#   * именованные тома вместо /var/local/... — это macOS, bind-mount в VM только мешает
#   * ARCHIVE_HOST: arc — имя сервиса, резолвится внутри сети compose
#   * без debug-агента (-agentlib:jdwp) и без лишних портов
#   * штатный Angular-UI вынесен в профиль legacy-ui: по умолчанию не поднимается
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml --profile legacy-ui up -d   # + старый UI на :18080

name: dcm4chee

services:
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.13-35.1
    environment:
      ARCHIVE_HOST: arc
      STORAGE_DIR: /storage/fs1
    volumes:
      - ldap-data:/var/lib/openldap/openldap-data
      - ldap-conf:/etc/openldap/slapd.d

  db:
    image: dcm4che/postgres-dcm4chee:17.9-35
    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
    volumes:
      - db-data:/var/lib/postgresql/data

  arc:
    image: dcm4che/dcm4chee-arc-psql:5.35.1
    ports:
      - "8080:8080"    # REST / DICOMweb
      - "9990:9990"    # WildFly management
      - "11112:11112"  # DICOM C-STORE/C-FIND/C-MOVE
      - "2762:2762"    # DICOM TLS
    environment:
      WILDFLY_ADMIN_USER: admin
      WILDFLY_ADMIN_PASSWORD: admin
      WILDFLY_DEPLOY_UI: "false"
      WILDFLY_PACSDS_USE_CCM: "false"
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:5432
      JAVA_OPTS: >-
        -Xms256m -Xmx1024m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=320m
        -Djava.net.preferIPv4Stack=true -Djava.awt.headless=true
    depends_on:
      - ldap
      - db
    volumes:
      - arc-wildfly:/opt/wildfly/standalone
      - arc-storage:/storage

  # Штатный Angular-UI — для сравнения и как запасной вариант.
  ui:
    profiles: ["legacy-ui"]
    image: dcm4che/dcm4chee-arc-psql:5.35.1
    ports:
      - "18080:18080"
    environment:
      WILDFLY_ADMIN_USER: admin
      WILDFLY_ADMIN_PASSWORD: admin
      WILDFLY_DEPLOY_UI: only
      WILDFLY_PACSDS_USE_CCM: "false"
      DCM4CHEE_ARC_URLS: http://localhost:8080/dcm4chee-arc
      HTTP_PORT: 18080
      HTTPS_PORT: 18443
      MANAGEMENT_HTTP_PORT: 19990
      MANAGEMENT_HTTPS_PORT: 19993
      WILDFLY_WAIT_FOR: arc:8080
      JAVA_OPTS: >-
        -Xms64m -Xmx512m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m
        -Djava.net.preferIPv4Stack=true -Djava.awt.headless=true
    depends_on:
      - arc
    volumes:
      - ui-wildfly:/opt/wildfly/standalone

volumes:
  ldap-data:
  ldap-conf:
  db-data:
  arc-wildfly:
  arc-storage:
  ui-wildfly:
